name: DawnServerAPI
version: '${version}'
author: Dawn
website: https://dawn.gg
main: gg.dawn.serverapi.bukkit.FeatherBukkitPlugin
load: STARTUP
api-version: "1.13"
provides: [ FeatherServerAPI ]

permissions:
  dawn-server-api.notify:
    description: Grants permission to see notifications
    default: op
  dawn-server-api.*:
    default: op
    children:
      - dawn-server-api.notify
